[package]
name = "sky_ecs_comparison"
version = "0.1.0"
edition.workspace = true
# Bevy ECS 0.19 requires Rust 1.95; the published Sky ECS crates remain at 1.85.
rust-version = "1.95"
publish = false
build = "build.rs"

[features]
default = []
api-experiments = []
parallel-experiments = [
    "dep:bevy_tasks",
    "dep:rayon",
    "bevy_ecs/multi_threaded",
    "shipyard/parallel",
]

[build-dependencies]
cc = "1.2"

[dependencies]
sky_ecs = { path = "../../crates/sky_ecs" }
criterion = "0.8.2"
cgmath = "0.18"
hecs = "0.11.0"
bevy_ecs = "0.19.0"
freecs = { version = "3.13.0", default-features = false }
shipyard = { version = "0.11.5", default-features = false, features = ["std", "proc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
bevy_tasks = { version = "0.19.0", optional = true, features = ["multi_threaded"] }
rayon = { version = "1.10", optional = true }

[[bench]]
name = "comparison"
path = "benches/comparison.rs"
harness = false

[[bench]]
name = "api_candidates"
path = "benches/api_candidates.rs"
harness = false
required-features = ["api-experiments"]

[[bench]]
name = "gameplay_phases"
path = "benches/gameplay_phases.rs"
harness = false

[[bench]]
name = "parallel_candidates"
path = "benches/parallel_candidates.rs"
harness = false
required-features = ["parallel-experiments"]

[[bin]]
name = "compare-ecs-publish"
path = "src/publish/main.rs"
bench = false
