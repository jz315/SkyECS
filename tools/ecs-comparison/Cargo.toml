[package]
name = "sky_ecs_comparison"
version = "0.1.0"
edition.workspace = true
# Bevy ECS 0.19 requires Rust 1.95; the published Sky ECS crates remain at 1.85.
rust-version = "1.95"
publish = false
build = "build.rs"

[build-dependencies]
cc = "1.2"

[dependencies]
sky_ecs = { path = "../../crates/sky_ecs" }
criterion = "0.8.2"
cgmath = "0.18"
hecs = "0.11.0"
bevy_ecs = "0.19.0"
flecs_ecs = { version = "0.2.2", default-features = false, features = ["std", "flecs_alerts", "flecs_os_api_impl", "flecs_query_rust_traits", "flecs_safety_locks", "flecs_disable_build_c"] }
freecs = { version = "3.13.0", default-features = false }
shipyard = { version = "0.11.5", default-features = false, features = ["std", "proc"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[[bench]]
name = "fair"
path = "benches/fair.rs"
harness = false

[[bin]]
name = "compare-ecs-publish"
path = "src/bin/publish.rs"
bench = false
