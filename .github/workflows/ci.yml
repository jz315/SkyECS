name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Configure LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "SKY_LLVM_ROOT=C:\Program Files\LLVM" >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Configure LLVM (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld llvm

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  miri:
    name: Miri (focused ECS safety paths)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld
      - run: cargo miri setup
      - name: Check focused storage and ownership paths
        shell: bash
        run: |
          cargo miri test -p sky_ecs --lib ecs::system::tests::schedule_panic_clears_all_command_buffers_even_when_drops_panic -- --exact
          cargo miri test -p sky_ecs --lib ecs::system::tests::shutdown_attempts_every_teardown_and_never_repeats_one -- --exact
          cargo miri test -p sky_ecs --lib ecs::system::tests::typed_parameter_shutdown_attempts_every_state_and_is_at_most_once -- --exact
          cargo miri test -p sky_ecs --lib ecs::bundle::tests::sixteen_component_bundle_initializes_every_column -- --exact
          cargo miri test -p sky_ecs --lib ecs::query::sequential::tests::chunk_plan_survives_in_chunk_row_churn -- --exact
          MIRIFLAGS=-Zmiri-tree-borrows cargo miri test -p sky_ecs --lib ecs::query::sequential::tests::chunk_plan_survives_in_chunk_row_churn -- --exact
          cargo miri test -p sky_ecs --test entity_access reads_non_copy_components_without_affecting_drop_semantics -- --exact
          cargo miri test -p sky_ecs --lib ecs::access::entity_view::tests::refreshes_pointer_when_tiny_chunk_keeps_id_during_promotion -- --exact
          MIRIFLAGS=-Zmiri-tree-borrows cargo miri test -p sky_ecs --lib ecs::access::entity_view::tests::refreshes_pointer_when_tiny_chunk_keeps_id_during_promotion -- --exact
          cargo miri test -p sky_ecs --test prepared_entity_view optional_only_queries_distinguish_live_entities_from_invalid_ids -- --exact
          cargo miri test -p sky_ecs --test prepared_entity_view mutable_and_derived_queries_fetch_one_row_directly -- --exact
          MIRIFLAGS=-Zmiri-tree-borrows cargo miri test -p sky_ecs --test prepared_entity_view mutable_and_derived_queries_fetch_one_row_directly -- --exact
          MIRIFLAGS=-Zmiri-tree-borrows cargo miri test -p sky_ecs --lib ecs::access::entity_view::tests::refreshes_recycled_routes_in_both_match_directions -- --exact
          cargo miri test -p sky_ecs --test prepared_entity_access mutable_plan_handles_distinct_zero_sized_and_over_aligned_components -- --exact
          MIRIFLAGS=-Zmiri-tree-borrows cargo miri test -p sky_ecs --test prepared_entity_access mutable_plan_handles_distinct_zero_sized_and_over_aligned_components -- --exact
          MIRIFLAGS=-Zmiri-tree-borrows cargo miri test -p sky_ecs --test prepared_entity_access mutable_plan_updates_non_copy_components_without_changing_ownership -- --exact
          cargo miri test -p sky_ecs --lib ecs::chunk::tests::panicking_component_drop_releases_storage_before_resuming -- --exact
          cargo miri test -p sky_ecs --lib ecs::chunk::tests::thread_exit_storage_drop_survives_pool_tls_destruction -- --exact
          MIRIFLAGS=-Zmiri-ignore-leaks cargo miri test -p sky_ecs --lib ecs::world::tests::direct_
          cargo miri test -p sky_ecs --lib ecs::commands::tests::apply_panic_discards_unvisited_reusable_slots -- --exact
          cargo miri test -p sky_ecs --lib ecs::commands::tests::apply_panic_swallows_panics_from_unvisited_command_drops -- --exact
          cargo miri test -p sky_ecs --lib ecs::system::tests::scheduled_resmut_is_miri_clean -- --exact
          cargo miri test -p sky_ecs --lib ecs::system::tests::scheduled_resource_access_mode_transitions_are_miri_clean -- --exact
          cargo miri test -p sky_ecs --lib ecs::system::tests::scheduled_entity_view_is_miri_clean -- --exact
          MIRIFLAGS=-Zmiri-tree-borrows cargo miri test -p sky_ecs --lib ecs::system::tests::scheduled_entity_view_is_miri_clean -- --exact
          cargo miri test -p sky_ecs --lib ecs::system::tests::fixed_system_panic_poisons_world_before_the_step_can_repeat -- --exact

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld
      - run: cargo check -p sky_type
      - run: cargo check -p sky_ecs --all-targets
      - run: cargo test -p sky_ecs --lib
      - run: cargo test -p sky_ecs_derive

  targets:
    name: Bench and package targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld llvm
      - run: cargo bench -p sky_ecs --no-run
      - run: cargo bench -p sky_ecs_comparison --bench comparison --no-run
      - run: cargo bench -p sky_ecs_comparison --bench gameplay_phases --no-run
      - run: cargo bench -p sky_ecs_comparison --bench api_candidates --features api-experiments --no-run
      - run: cargo package -p sky_type --allow-dirty
      - run: cargo package -p sky_ecs_derive --allow-dirty
      # Cargo cannot resolve core's crates.io dependency until derive 0.1.1 is
      # actually published. Validate the package file set now; the release
      # procedure runs full core packaging after publishing derive.
      - run: cargo package -p sky_ecs --allow-dirty --list
