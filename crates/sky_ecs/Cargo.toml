[package]
name = "sky_ecs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "High-performance typed chunk-based ECS for Rust"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sky_ecs"
keywords = ["ecs", "game", "data-oriented", "parallel", "performance"]
categories = ["data-structures", "game-development"]
autobenches = false

[dependencies]
lazy_static = "1.4.0"
rayon = "1.10"
rustc-hash = "2.1.2"
sky_type = { version = "0.1.2", path = "../sky_type" }
sky_profile = { version = "0.1.0", optional = true }
smallvec = "1.13.2"
sky_ecs_derive = { version = "0.1.1", path = "../sky_ecs_derive" }

[dev-dependencies]
# Criterion 0.8 requires Rust 1.86. Keep the published crate's local benches
# on the workspace MSRV; the comparison harness owns its newer toolchain.
criterion = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
profile = ["dep:sky_profile"]

[[bench]]
name = "parallel_query"
harness = false

[[bench]]
name = "bound_query"
harness = false

[[bench]]
name = "random_access"
harness = false

[[bench]]
name = "archetype_match"
harness = false

[[bench]]
name = "query_prepare_fragmented"
harness = false

[[bench]]
name = "parallel_job_cache"
harness = false

[[bench]]
name = "system_schedule"
harness = false

[[bench]]
name = "chunk_cost"
harness = false

[[bench]]
name = "entity_view"
harness = false

[[bench]]
name = "gameplay_api"
harness = false

[[bench]]
name = "structural_writes"
harness = false
