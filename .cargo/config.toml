[alias]
compare-ecs = ["bench", "-p", "sky_ecs_comparison", "--bench", "comparison"]
compare-ecs-publish = ["run", "-p", "sky_ecs_comparison", "--release", "--bin", "compare-ecs-publish"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
